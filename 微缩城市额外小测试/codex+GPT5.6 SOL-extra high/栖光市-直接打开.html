<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07100f" />
  <title>栖光市 · 3D 微缩城市</title>
  <style>:root {
  color-scheme: dark;
  --ink: #f4f0e6;
  --muted: rgba(236, 240, 229, .56);
  --line: rgba(255, 255, 255, .12);
  --glass: rgba(10, 18, 17, .62);
  --coral: #ff765c;
  --mint: #80d9b4;
  --yellow: #ffd574;
  --blue: #64b9d6;
}

* { box-sizing: border-box; }
html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body { background: #07100f; color: var(--ink); font-family: "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif; }
button, input { font: inherit; }
button { color: inherit; }

#app { position: relative; isolation: isolate; background: radial-gradient(circle at 55% 40%, #1d2d29 0%, #07100f 70%); }
#city-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#city-canvas:active { cursor: grabbing; }
.ambient-grain { position: absolute; inset: 0; pointer-events: none; opacity: .045; z-index: 2; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E"); mix-blend-mode: screen; }

.glass { background: linear-gradient(145deg, rgba(20, 29, 27, .74), rgba(7, 13, 13, .56)); border: 1px solid var(--line); box-shadow: 0 20px 70px rgba(0, 0, 0, .22), inset 0 1px 0 rgba(255,255,255,.055); backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2); }
.topbar { position: absolute; z-index: 5; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 26px 32px; pointer-events: none; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand-mark, .loader-mark { position: relative; width: 40px; height: 40px; border: 1px solid rgba(255,255,255,.24); border-radius: 50%; }
.brand-mark::before, .loader-mark::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; border: 1px solid rgba(255,255,255,.17); }
.brand-mark span, .brand-mark i, .loader-mark span, .loader-mark i { position: absolute; display: block; background: var(--coral); border-radius: 99px; transform-origin: 0 50%; }
.brand-mark span, .loader-mark span { width: 12px; height: 2px; left: 20px; top: 19px; transform: rotate(-50deg); }
.brand-mark i, .loader-mark i { width: 7px; height: 2px; left: 20px; top: 19px; transform: rotate(35deg); background: var(--yellow); }
.eyebrow { margin: 0 0 1px; font-family: "DM Mono", monospace; letter-spacing: .16em; font-size: 9px; color: rgba(255,255,255,.47); }
h1 { margin: 0; font-size: 22px; letter-spacing: .22em; font-weight: 600; }
.live-chip { display: flex; align-items: center; gap: 8px; padding: 9px 13px; border: 1px solid rgba(255,255,255,.1); border-radius: 99px; background: rgba(6,13,12,.38); color: rgba(255,255,255,.66); font-size: 11px; }
.live-chip span { width: 6px; height: 6px; background: #79d7a7; border-radius: 50%; box-shadow: 0 0 0 4px rgba(121,215,167,.12), 0 0 12px #79d7a7; animation: pulse 2s infinite; }

.time-panel { position: absolute; z-index: 5; top: 102px; left: 32px; width: 268px; padding: 19px 20px 17px; border-radius: 18px; }
.time-head { display: flex; align-items: center; justify-content: space-between; }
.time-head p { margin: 0 0 3px; color: var(--yellow); font-size: 11px; }
.time-head strong { font-family: "DM Mono", monospace; font-weight: 500; font-size: 36px; letter-spacing: -.06em; }
.weather-icon { position: relative; width: 43px; height: 43px; border-radius: 50%; background: radial-gradient(circle, rgba(255,213,116,.2), rgba(255,213,116,0) 68%); animation: slowspin 20s linear infinite; }
.sun-core { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--yellow); top: 15px; left: 15px; box-shadow: 0 0 16px rgba(255,213,116,.8); }
.sun-ray, .sun-ray::before, .sun-ray::after { position: absolute; width: 1px; height: 36px; left: 21px; top: 3px; background: linear-gradient(transparent 0 14%, rgba(255,213,116,.6) 14% 26%, transparent 26% 74%, rgba(255,213,116,.6) 74% 86%, transparent 86%); content: ""; }
.sun-ray::before { left: 0; top: 0; transform: rotate(60deg); }
.sun-ray::after { left: 0; top: 0; transform: rotate(120deg); }
.weather-icon.night { animation: none; background: radial-gradient(circle, rgba(143,199,221,.18), rgba(143,199,221,0) 68%); }
.weather-icon.night .sun-core { width: 15px; height: 15px; top: 13px; left: 13px; background: #b8d8e5; box-shadow: 0 0 16px rgba(143,199,221,.62); }
.weather-icon.night .sun-core::after { content: ""; position: absolute; width: 15px; height: 15px; left: 5px; top: -4px; border-radius: 50%; background: #1a2728; }
.weather-icon.night .sun-ray { display: none; }
.weather-icon.dusk { filter: hue-rotate(-20deg) saturate(1.3); }
.timeline-wrap { margin-top: 16px; }
.timeline-labels { display: flex; justify-content: space-between; color: rgba(255,255,255,.36); font: 8px "DM Mono", monospace; }
input[type="range"] { appearance: none; width: 100%; height: 14px; margin: 4px 0 7px; background: transparent; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 4px; background: linear-gradient(90deg, #30526c, #ffd574 28%, #efe5ba 50%, #ff8d67 74%, #1e3353); }
input[type="range"]::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; margin-top: -4.5px; border: 2px solid #fff5d8; border-radius: 50%; background: #ffb86d; box-shadow: 0 0 0 4px rgba(255,184,109,.14), 0 0 14px rgba(255,184,109,.6); }
.time-actions { display: flex; align-items: center; gap: 10px; }
.icon-btn { display: grid; place-items: center; width: 31px; height: 31px; padding: 0; border-radius: 9px; border: 1px solid rgba(255,255,255,.11); background: rgba(255,255,255,.055); cursor: pointer; }
.icon-btn svg { width: 14px; height: 14px; fill: currentColor; }
.speed-group { display: grid; grid-template-columns: repeat(3, 1fr); flex: 1; gap: 4px; padding: 3px; border-radius: 10px; background: rgba(0,0,0,.19); }
.speed-btn { border: 0; border-radius: 7px; padding: 5px 0; color: rgba(255,255,255,.43); font: 10px "DM Mono", monospace; background: transparent; cursor: pointer; }
.speed-btn.active { color: #151c19; background: #e8e4d4; box-shadow: 0 3px 8px rgba(0,0,0,.18); }

.stats-panel { position: absolute; z-index: 5; top: 102px; right: 32px; width: 252px; padding: 19px; border-radius: 18px; }
.section-kicker { color: var(--mint); font: 9px "DM Mono", monospace; letter-spacing: .15em; }
.stats-panel h2 { margin: 6px 0 16px; font-size: 15px; font-weight: 500; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid rgba(255,255,255,.08); border-radius: 12px; overflow: hidden; }
.stat { position: relative; min-height: 62px; padding: 10px 11px; border-right: 1px solid rgba(255,255,255,.07); border-bottom: 1px solid rgba(255,255,255,.07); }
.stat:nth-child(2n) { border-right: 0; }
.stat:nth-last-child(-n+2) { border-bottom: 0; }
.stat span { display: block; color: rgba(255,255,255,.4); font-size: 9px; }
.stat strong { font: 500 19px "DM Mono", monospace; }
.stat small { margin-left: 3px; color: rgba(255,255,255,.35); font: 8px "DM Mono", monospace; }
.stat .ok { position: absolute; right: 12px; bottom: 17px; width: 6px; height: 6px; background: #69d29e; border-radius: 50%; box-shadow: 0 0 8px rgba(105,210,158,.8); }
.district-list { display: grid; gap: 3px; margin-top: 13px; }
.district-list button { display: grid; grid-template-columns: 12px 1fr auto; align-items: center; gap: 7px; border: 0; border-radius: 8px; padding: 7px 8px; text-align: left; color: rgba(255,255,255,.65); font-size: 10px; background: transparent; cursor: pointer; transition: .2s ease; }
.district-list button:hover { color: #fff; background: rgba(255,255,255,.07); transform: translateX(2px); }
.district-list em { color: rgba(255,255,255,.25); font: normal 8px "DM Mono", monospace; }
.dot { width: 5px; height: 5px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
.coral { color: var(--coral); background: var(--coral); }.green { color: var(--mint); background: var(--mint); }.yellow { color: var(--yellow); background: var(--yellow); }.blue { color: var(--blue); background: var(--blue); }

.controls { position: absolute; z-index: 5; left: 32px; bottom: 28px; display: flex; align-items: center; gap: 12px; width: 330px; padding: 11px 12px; border-radius: 14px; }
.controls strong { display: block; font-size: 11px; font-weight: 500; }
.controls p { margin: 2px 0 0; font-size: 8px; color: rgba(255,255,255,.39); }
.controls button { margin-left: auto; border: 1px solid rgba(255,255,255,.11); border-radius: 8px; padding: 7px 9px; color: rgba(255,255,255,.55); font-size: 9px; background: rgba(255,255,255,.045); cursor: pointer; }
.controls button:hover { color: #fff; background: rgba(255,255,255,.1); }
.control-icon { position: relative; flex: 0 0 31px; height: 31px; border-radius: 9px; background: rgba(255,255,255,.06); }
.orbit-icon::before, .orbit-icon::after { content: ""; position: absolute; border: 1px solid rgba(255,255,255,.48); border-radius: 50%; }
.orbit-icon::before { inset: 8px 5px; transform: rotate(-20deg); }.orbit-icon::after { inset: 5px 9px; transform: rotate(30deg); }
.orbit-icon span { position: absolute; width: 4px; height: 4px; top: 8px; right: 6px; background: var(--coral); border-radius: 50%; box-shadow: 0 0 7px var(--coral); }

.scene-label { position: absolute; z-index: 4; display: flex; align-items: center; gap: 6px; transform: translate(-50%, -50%); pointer-events: none; opacity: .86; transition: opacity .3s; }
.scene-label span { display: grid; place-items: center; width: 19px; height: 19px; border: 1px solid rgba(255,255,255,.38); border-radius: 50%; color: #fff; font: 7px "DM Mono", monospace; background: rgba(7,14,13,.55); }
.scene-label b { padding: 4px 7px; border: 1px solid rgba(255,255,255,.13); border-radius: 6px; color: rgba(255,255,255,.75); font-size: 8px; font-weight: 500; background: rgba(7,14,13,.58); backdrop-filter: blur(8px); }
.scene-label i { position: absolute; width: 1px; height: 27px; left: 9px; top: 20px; background: linear-gradient(rgba(255,255,255,.3), transparent); }

#loading-screen { position: absolute; z-index: 20; inset: 0; display: grid; place-content: center; justify-items: center; background: #08110f; transition: opacity .8s ease, visibility .8s; }
#loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
#loading-screen p { margin: 18px 0 12px; color: rgba(255,255,255,.55); font-size: 11px; letter-spacing: .24em; }
.loader-mark { width: 56px; height: 56px; animation: slowspin 2s linear infinite; }
.loader-mark::before { inset: 11px; }.loader-mark span, .loader-mark i { left: 28px; top: 27px; }
.loader-line { width: 120px; height: 2px; overflow: hidden; border-radius: 2px; background: rgba(255,255,255,.09); }
.loader-line span { display: block; width: 45%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--coral), var(--yellow)); animation: load 1.15s ease-in-out infinite; }
.loader-retry { display: none; margin-top: 16px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.16); border-radius: 9px; color: rgba(255,255,255,.72); background: rgba(255,255,255,.06); cursor: pointer; }
#loading-screen.failed .loader-mark { animation: none; border-color: rgba(255,118,92,.48); }
#loading-screen.failed .loader-line { display: none; }
#loading-screen.failed .loader-retry { display: block; }
#loading-screen.failed p { color: #ff9d89; letter-spacing: .08em; }

@keyframes pulse { 50% { opacity: .45; transform: scale(.8); } }
@keyframes slowspin { to { transform: rotate(360deg); } }
@keyframes load { 0% { transform: translateX(-110%); } 100% { transform: translateX(230%); } }

@media (max-width: 820px) {
  .topbar { padding: 18px; }
  .live-chip { display: none; }
  .time-panel { top: 84px; left: 16px; width: 234px; }
  .stats-panel { top: auto; right: 16px; bottom: 16px; width: 210px; }
  .stats-panel h2, .district-list { display: none; }
  .controls { left: 16px; bottom: 16px; width: auto; padding: 9px; }
  .controls > div:nth-child(2), .controls button { display: none; }
  .scene-label { display: none; }
}

@media (max-width: 520px) {
  .brand h1 { font-size: 18px; }
  .time-panel { width: calc(100% - 32px); }
  .stats-panel { right: 16px; left: 16px; bottom: 14px; width: auto; padding: 11px; }
  .stats-panel > .section-kicker { display: none; }
  .stat { min-height: 48px; padding: 7px 9px; }
  .controls { display: none; }
}
</style>
</head>
<body>
  <main id="app" aria-label="栖光市 3D 微缩景观">
    <canvas id="city-canvas"></canvas>

    <div class="ambient-grain" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><span></span><i></i></div>
        <div>
          <p class="eyebrow">QIGUANG · MINIATURE CITY</p>
          <h1>栖光市</h1>
        </div>
      </div>
      <div class="live-chip"><span></span> 城市实时运行中</div>
    </header>

    <section class="time-panel glass" aria-label="城市时间">
      <div class="time-head">
        <div>
          <p id="period-label">晨间 · 通勤时段</p>
          <strong id="city-time">07:30</strong>
        </div>
        <div id="weather-icon" class="weather-icon" aria-hidden="true">
          <span class="sun-core"></span><span class="sun-ray"></span>
        </div>
      </div>
      <div class="timeline-wrap">
        <div class="timeline-labels"><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>
        <input id="time-slider" type="range" min="0" max="24" value="7.5" step="0.05" aria-label="调整城市时间" />
      </div>
      <div class="time-actions">
        <button id="pause-btn" class="icon-btn" type="button" aria-label="暂停时间">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3v14H7zm7 0h3v14h-3z"/></svg>
        </button>
        <div class="speed-group" role="group" aria-label="时间流速">
          <button class="speed-btn active" data-speed="1" type="button">×1</button>
          <button class="speed-btn" data-speed="4" type="button">×4</button>
          <button class="speed-btn" data-speed="12" type="button">×12</button>
        </div>
      </div>
    </section>

    <aside class="stats-panel glass" aria-label="城市运行数据">
      <div class="section-kicker">CITY PULSE</div>
      <h2>此刻，城市正在呼吸</h2>
      <div class="stat-grid">
        <div class="stat"><span>路网流量</span><strong id="traffic-stat">顺畅</strong><i class="ok"></i></div>
        <div class="stat"><span>运行车辆</span><strong id="vehicle-stat">28</strong><small>辆</small></div>
        <div class="stat"><span>清洁能源</span><strong id="energy-stat">83</strong><small>%</small></div>
        <div class="stat"><span>公共空间</span><strong>14.6</strong><small>ha</small></div>
      </div>
      <div class="district-list">
        <button type="button" data-focus="cbd"><span class="dot coral"></span>云际商务区<em>CBD</em></button>
        <button type="button" data-focus="park"><span class="dot green"></span>栖湖生态带<em>ECO</em></button>
        <button type="button" data-focus="home"><span class="dot yellow"></span>星港住区<em>LIVE</em></button>
        <button type="button" data-focus="energy"><span class="dot blue"></span>东岸能源岛<em>GRID</em></button>
      </div>
    </aside>

    <section class="controls glass" aria-label="视角操作说明">
      <div class="control-icon orbit-icon"><span></span></div>
      <div><strong>探索这座城市</strong><p>拖拽旋转 · 滚轮缩放 · 右键平移</p></div>
      <button id="reset-view" type="button">复位视角</button>
    </section>

    <div class="scene-labels" aria-hidden="true">
      <div class="scene-label" data-label="cbd"><span>01</span><b>云际商务区</b><i></i></div>
      <div class="scene-label" data-label="park"><span>02</span><b>栖湖生态带</b><i></i></div>
      <div class="scene-label" data-label="home"><span>03</span><b>星港住区</b><i></i></div>
      <div class="scene-label" data-label="energy"><span>04</span><b>东岸能源岛</b><i></i></div>
    </div>

    <div id="loading-screen">
      <div class="loader-mark"><span></span><i></i></div>
      <p>正在唤醒城市</p>
      <div class="loader-line"><span></span></div>
      <button class="loader-retry" type="button" onclick="location.reload()">重新加载</button>
    </div>
  </main>
  <script>
    window.showCityLoadError = function (message) {
      var loader = document.getElementById('loading-screen');
      if (!loader) return;
      loader.classList.add('failed');
      loader.querySelector('p').textContent = message || '城市加载失败，请刷新重试';
    };
    window.setTimeout(function () {
      if (!window.__cityStarted) window.showCityLoadError('加载超时，请使用 Chrome 或 Edge 重新打开');
    }, 12000);
